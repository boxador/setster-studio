name: Publish Studio to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Validate release metadata and bundle
        run: |
          node -e 'const fs = require("fs"); const p = require("./package.json"); if (process.env.RELEASE_TAG !== "v" + p.version) throw new Error("Release tag does not match package version"); if (!fs.existsSync(p.main)) throw new Error("Package entry point is missing");'
          npm pack --dry-run --ignore-scripts
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Publish to latest
        run: npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Update alpha tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm dist-tag add "@setster/setster-studio-core@$VERSION" alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
